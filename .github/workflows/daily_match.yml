name: Daily Data Matching Bot

on:
  schedule:
    # รันอัตโนมัติทุกวันเวลา 06:05 น. ตามเวลาไทย (23:05 UTC เพื่อเลี่ยงคิวหน่วงของ GitHub ตอนต้นชั่วโมง)
    - cron: '5 23 * * *'
  workflow_dispatch: # ปุ่มกดรันระบบเองแบบ Manual ได้ตลอดเวลาใน GitHub Actions

jobs:
  run-matching:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Match Bot and Send Telegram
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '7603648423' }}
        GDRIVE_FOLDER_URL: ${{ secrets.GDRIVE_FOLDER_URL || 'https://drive.google.com/drive/folders/17eSUsgGmTwRexYmyBRSW_OaanuwLYR3g?usp=sharing' }}
        GDRIVE_UPLOAD_URL: ${{ secrets.GDRIVE_UPLOAD_URL }}
        GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      run: |
        python match_bot.py

    - name: Upload Match Result Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: daily-match-result
        path: match_result*.xlsx
        retention-days: 30
